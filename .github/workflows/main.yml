name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and build Gradle project
      run: |
        # gradlew ফাইলটি যেখানেই থাকুক না কেন খুঁজে বের করে রান করবে
        GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "No gradlew file found! Running gradle directly..."
          gradle assembleDebug
        else
          echo "Found gradlew at: $GRADLEW_PATH"
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
